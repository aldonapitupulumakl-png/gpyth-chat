<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0d12" />
  <title>Gpyth Chat — Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card">

      <!-- Logo & Judul -->
      <div class="logo-section">
        <div class="logo-icon">🎲</div>
        <h1 class="logo-title">Gpyth Chat</h1>
        <p class="logo-tagline">Chat anonim. Tanpa identitas. Tanpa jejak.</p>
      </div>

      <!-- Gacha ID -->
      <div class="gacha-section">
        <label class="gacha-label">ID Gacha Kamu</label>
        <div class="id-display" id="idDisplay">----</div>
        <button class="btn btn-gacha" id="gachaBtn">
          <span>🎲</span> Gacha ID
        </button>
      </div>

      <!-- Tombol Masuk -->
      <button class="btn btn-masuk" id="masukBtn" disabled>
        Masuk
      </button>

      <p class="note" id="note">Tekan "Gacha ID" dulu buat dapat ID kamu</p>

    </div>

    <p class="footer-text">Gpyth Chat · MVP v0.1</p>
  </div>

  <script>
    // ============ LOGIKA GACHA (sementara inline) ============
    const gachaBtn  = document.getElementById('gachaBtn');
    const masukBtn  = document.getElementById('masukBtn');
    const idDisplay = document.getElementById('idDisplay');
    const note      = document.getElementById('note');

    // Kalau user udah punya ID di localStorage, tampilkan
    const savedId = localStorage.getItem('gpyth_id');
    if (savedId) {
      idDisplay.textContent = savedId;
      masukBtn.disabled = false;
      note.textContent = 'ID tersimpan. Klik "Masuk" buat lanjut.';
    }

    // Gacha ID random 1000–9999
    gachaBtn.addEventListener('click', () => {
      const newId = Math.floor(Math.random() * 9000) + 1000;
      idDisplay.textContent = newId;
      localStorage.setItem('gpyth_id', newId);
      masukBtn.disabled = false;
      note.textContent = 'ID berhasil di-gacha! Klik "Masuk".';

      // Efek pop
      idDisplay.classList.remove('pop');
      void idDisplay.offsetWidth; // reflow trick
      idDisplay.classList.add('pop');
    });

    // Masuk ke halaman utama
    masukBtn.addEventListener('click', () => {
      window.location.href = 'home.html';
    });
  </script>

</body>
</html>
